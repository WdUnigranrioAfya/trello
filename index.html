<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Kanban - Esteira Trello</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #334155;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    header {
      background-color: var(--panel-bg);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      gap: 16px;
      flex-wrap: wrap;
    }

    .title-area h1 { font-size: 1.25rem; color: var(--accent); font-weight: 700; }
    .title-area p { font-size: 0.8rem; color: var(--text-muted); }

    .actions { display: flex; gap: 12px; align-items: center; }

    input[type="file"] { display: none; }
    
    .btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn:hover { background-color: var(--border-color); }
    .btn-primary { background-color: var(--accent); color: #0f172a; border: none; font-weight: 600; }
    .btn-primary:hover { background-color: var(--accent-hover); color: #fff; }

    .search-bar {
      padding: 8px 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
      font-size: 0.875rem;
      width: 260px;
    }

    .kanban-board {
      flex: 1;
      display: flex;
      overflow-x: auto;
      padding: 20px;
      gap: 16px;
      align-items: flex-start;
    }

    .kanban-column {
      background-color: var(--panel-bg);
      min-width: 300px;
      max-width: 320px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      max-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .column-header {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(255, 255, 255, 0.02);
    }

    .badge {
      background-color: var(--card-bg);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--accent);
    }

    .column-cards {
      padding: 12px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      cursor: grab;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card.dragging { opacity: 0.4; }

    .card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }

    .card-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }
    .card-tag { display: inline-block; background-color: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; width: fit-content; }

    /* Modal Styling */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 1.1rem; color: var(--accent); }
    .close-btn { cursor: pointer; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); }
    .form-control {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.875rem;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-area">
      <h1>Esteira de Produção Kanban</h1>
      <p>Gestão e Atualização do CSV do Trello</p>
    </div>
    <div class="actions">
      <input type="text" id="searchInput" class="search-bar" placeholder="Pesquisar disciplinas ou responsáveis..." oninput="filterCards()">
      <label class="btn">
        📁 Carregar CSV
        <input type="file" id="csvFileInput" accept=".csv" onchange="handleFileUpload(event)">
      </label>
      <button class="btn btn-primary" onclick="exportUpdatedCSV()">💾 Exportar CSV Atualizado</button>
    </div>
  </header>

  <main class="kanban-board" id="kanbanBoard">
    <div class="empty-state">
      <h2>Nenhum ficheiro carregado</h2>
      <p>Clique em <strong>"Carregar CSV"</strong> e selecione o seu ficheiro do Trello para visualizar o quadro.</p>
    </div>
  </main>

  <!-- Modal Edição de Card -->
  <div class="modal-backdrop" id="cardModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Editar Card</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalBody">
        <!-- Campos gerados via JS -->
      </div>
      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
        <button class="btn" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="saveCardDetails()">Guardar Alterações</button>
      </div>
    </div>
  </div>

  <script>
    let rawCSVHeaders = [];
    let csvData = [];
    let activeCardIndex = null;

    // Parser CSV RFC4180 Robusto em JS Puro
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let token = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i+1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            token += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(token);
          token = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(token);
          token = '';
          if (row.length > 0 && !(row.length === 1 && row[0] === '')) {
            lines.push(row);
          }
          row = [];
        } else {
          token += char;
        }
      }
      if (token !== '' || row.length > 0) {
        row.push(token);
        lines.push(row);
      }
      return lines;
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        const parsed = parseCSV(text);

        if (parsed.length < 1) return;

        rawCSVHeaders = parsed[0];
        csvData = parsed.slice(1).map((row, index) => {
          const item = { _index: index };
          rawCSVHeaders.forEach((header, i) => {
            item[header] = row[i] !== undefined ? row[i] : '';
          });
          return item;
        });

        renderKanban();
      };
      reader.readAsText(file);
    }

    function renderKanban() {
      const board = document.getElementById('kanbanBoard');
      board.innerHTML = '';

      if (csvData.length === 0) {
        board.innerHTML = `<div class="empty-state"><h2>Sem dados para apresentar</h2></div>`;
        return;
      }

      // Descobrir todas as listas/colunas únicas
      const columnsSet = new Set();
      csvData.forEach(item => {
        const colName = item['List Name'] ? item['List Name'].trim() : 'Sem Coluna';
        if (colName) columnsSet.add(colName);
      });

      const columns = Array.from(columnsSet);

      const query = document.getElementById('searchInput').value.toLowerCase();

      columns.forEach(col => {
        const colDiv = document.createElement('div');
        colDiv.className = 'kanban-column';
        colDiv.dataset.colname = col;

        const cardsInCol = csvData.filter(item => {
          const matchesCol = (item['List Name'] || 'Sem Coluna').trim() === col;
          const matchesSearch = !query || 
            (item['Card Name'] && item['Card Name'].toLowerCase().includes(query)) ||
            (item['Members'] && item['Members'].toLowerCase().includes(query)) ||
            (item['DI'] && item['DI'].toLowerCase().includes(query));
          return matchesCol && matchesSearch;
        });

        colDiv.innerHTML = `
          <div class="column-header">
            <span>${col}</span>
            <span class="badge">${cardsInCol.length}</span>
          </div>
          <div class="column-cards" ondragover="allowDrop(event)" ondrop="dropCard(event, '${col}')">
          </div>
        `;

        const cardsContainer = colDiv.querySelector('.column-cards');

        cardsInCol.forEach(item => {
          const cardEl = document.createElement('div');
          cardEl.className = 'card';
          cardEl.draggable = true;
          cardEl.dataset.index = item._index;
          cardEl.ondragstart = (e) => dragStart(e, item._index);
          cardEl.onclick = () => openCardModal(item._index);

          const cardTitle = item['Card Name'] || 'Sem Nome';
          const member = item['Members'] || item['DI'] || 'Não atribuído';
          const startDate = item['Start Date'] || item['DT INÍCIO DI'] || '';
          const dueDate = item['Due Date'] || item['DT FIM DI'] || '';

          cardEl.innerHTML = `
            <div class="card-title">${cardTitle}</div>
            <div class="card-meta">
              ${member !== 'Não atribuído' ? `<span class="card-tag">👤 ${member}</span>` : ''}
              ${startDate ? `<div>📅 Início: ${startDate}</div>` : ''}
              ${dueDate ? `<div>⏳ Fim: ${dueDate}</div>` : ''}
            </div>
          `;
          cardsContainer.appendChild(cardEl);
        });

        board.appendChild(colDiv);
      });
    }

    function dragStart(e, index) {
      e.dataTransfer.setData("text/plain", index);
    }

    function allowDrop(e) {
      e.preventDefault();
    }

    function dropCard(e, targetColumn) {
      e.preventDefault();
      const index = e.dataTransfer.getData("text/plain");
      if (index !== null && csvData[index]) {
        csvData[index]['List Name'] = targetColumn;
        renderKanban();
      }
    }

    function filterCards() {
      renderKanban();
    }

    function openCardModal(index) {
      activeCardIndex = index;
      const item = csvData[index];
      const modalBody = document.getElementById('modalBody');

      modalBody.innerHTML = `
        <div class="form-group">
          <label>Nome da Disciplina / Card</label>
          <input type="text" class="form-control" id="editCardName" value="${item['Card Name'] || ''}">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Coluna / Estado atual</label>
            <input type="text" class="form-control" id="editListName" value="${item['List Name'] || ''}">
          </div>
          <div class="form-group">
            <label>Membros / Integrantes</label>
            <input type="text" class="form-control" id="editMembers" value="${item['Members'] || ''}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Data de Início</label>
            <input type="text" class="form-control" id="editStartDate" value="${item['Start Date'] || ''}">
          </div>
          <div class="form-group">
            <label>Data de Término / Vencimento</label>
            <input type="text" class="form-control" id="editDueDate" value="${item['Due Date'] || ''}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>DI Responsável</label>
            <input type="text" class="form-control" id="editDI" value="${item['DI'] || ''}">
          </div>
          <div class="form-group">
            <label>Revisor</label>
            <input type="text" class="form-control" id="editRevisor" value="${item['REVISOR'] || ''}">
          </div>
        </div>
        <div class="form-group">
          <label>Descrição / Observações</label>
          <textarea class="form-control" id="editCardDesc" rows="4">${item['Card Description'] || ''}</textarea>
        </div>
      `;

      document.getElementById('cardModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('cardModal').style.display = 'none';
      activeCardIndex = null;
    }

    function saveCardDetails() {
      if (activeCardIndex === null) return;
      const item = csvData[activeCardIndex];

      item['Card Name'] = document.getElementById('editCardName').value;
      item['List Name'] = document.getElementById('editListName').value;
      item['Members'] = document.getElementById('editMembers').value;
      item['Start Date'] = document.getElementById('editStartDate').value;
      item['Due Date'] = document.getElementById('editDueDate').value;
      if (item.hasOwnProperty('DI')) item['DI'] = document.getElementById('editDI').value;
      if (item.hasOwnProperty('REVISOR')) item['REVISOR'] = document.getElementById('editRevisor').value;
      item['Card Description'] = document.getElementById('editCardDesc').value;

      closeModal();
      renderKanban();
    }

    function escapeCSVCell(str) {
      if (str === null || str === undefined) return '""';
      let s = String(str);
      if (s.includes('"') || s.includes(',') || s.includes('\n') || s.includes('\r')) {
        s = '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }

    function exportUpdatedCSV() {
      if (csvData.length === 0 || rawCSVHeaders.length === 0) {
        alert("Não existem dados para exportar.");
        return;
      }

      let csvContent = rawCSVHeaders.map(escapeCSVCell).join(',') + '\r\n';

      csvData.forEach(row => {
        const line = rawCSVHeaders.map(header => escapeCSVCell(row[header] || '')).join(',');
        csvContent += line + '\r\n';
      });

      const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'trello_esteira_atualizada.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
